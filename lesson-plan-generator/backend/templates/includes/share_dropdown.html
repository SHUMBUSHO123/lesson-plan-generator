<style>
.nav-share-wrap { position: relative; display: inline-block; }

.nav-share-btn {
    border: none; background: none; cursor: pointer; font: inherit;
    display: flex; align-items: center; gap: 5px;
    min-height: 40px; padding: 4px 8px;
}

#shareBackdrop { display: none; }

#shareDropdown {
    display: none;
    position: absolute; right: 0; top: calc(100% + 14px);
    background: #fff; border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    padding: 14px 18px; z-index: 2000;
    gap: 18px; white-space: nowrap;
    border: 1px solid rgba(0,0,0,0.08);
    align-items: center;
}

.share-caret {
    position: absolute; top: -6px; right: 14px; width: 12px; height: 12px;
    background: #fff; transform: rotate(45deg);
    border-left: 1px solid rgba(0,0,0,0.08); border-top: 1px solid rgba(0,0,0,0.08);
}

.share-sheet-title { display: none; }

.share-icon {
    display: inline-flex; flex-direction: column; align-items: center; gap: 4px;
    text-decoration: none; min-width: 44px; min-height: 44px; justify-content: center;
    border-radius: 8px; transition: background 0.15s;
}
.share-icon:hover { background: rgba(0,0,0,0.05); }
.share-icon-label { display: none; font-size: 0.68rem; color: #555; }

/* ── Mobile: bottom sheet instead of floating dropdown ── */
@media (max-width: 600px) {
    #shareBackdrop.active {
        display: block; position: fixed; inset: 0;
        background: rgba(0,0,0,0.4); z-index: 1999;
    }
    #shareDropdown {
        position: fixed; left: 0; right: 0; top: auto; bottom: 0;
        border-radius: 16px 16px 0 0;
        padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
        justify-content: space-around;
        box-shadow: 0 -4px 24px rgba(0,0,0,0.3);
        gap: 8px;
    }
    .share-caret { display: none; }
    .share-sheet-title {
        display: block; position: absolute; top: 8px; left: 50%;
        transform: translateX(-50%); font-size: 0.85rem; font-weight: 600; color: #333;
    }
    #shareDropdown { padding-top: 34px; }
    .share-icon-label { display: block; }
}
</style>

<script>
(function() {
    const btn = document.getElementById('shareToggleBtn');
    const dropdown = document.getElementById('shareDropdown');
    const backdrop = document.getElementById('shareBackdrop');
    if (!btn || !dropdown) return;

    function openShare() {
        dropdown.style.display = 'flex';
        if (window.innerWidth <= 600) backdrop.classList.add('active');
    }
    function closeShare() {
        dropdown.style.display = 'none';
        backdrop.classList.remove('active');
    }

    btn.addEventListener('click', function(e) {
        e.stopPropagation();
        dropdown.style.display === 'flex' ? closeShare() : openShare();
    });
    document.addEventListener('click', function(e) {
        if (!dropdown.contains(e.target) && e.target !== btn) closeShare();
    });
    backdrop.addEventListener('click', closeShare);
})();
</script>
