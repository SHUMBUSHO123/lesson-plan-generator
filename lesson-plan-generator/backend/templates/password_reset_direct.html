{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | CBC Lesson Planner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #f4f7f5;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 40px rgba(0,0,0,0.10);
      width: 100%; max-width: 400px;
      padding: 2.5rem 2rem;
    }
    .back-btn {
      display: inline-block; color: #6b7280;
      font-size: 0.85rem; text-decoration: none; margin-bottom: 1.5rem;
    }
    .back-btn:hover { color: #1a7a4a; }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 1.8rem; }
    .logo-icon {
      width: 38px; height: 38px; background: #1a7a4a;
      border-radius: 9px; display: flex; align-items: center;
      justify-content: center; font-size: 1.1rem;
    }
    .logo-text { font-size: 1rem; font-weight: 700; color: #1a1a2e; }
    .logo-sub  { font-size: 0.72rem; color: #6b7280; }
    h1 { font-size: 1.6rem; font-weight: 700; color: #1a1a2e; margin-bottom: 0.25rem; }
    .sub { font-size: 0.85rem; color: #6b7280; margin-bottom: 1.6rem; }
    .msg {
      padding: 0.8rem 1rem; border-radius: 10px;
      font-size: 0.84rem; font-weight: 500; margin-bottom: 1.2rem;
      display: flex; align-items: flex-start; gap: 8px;
    }
    .msg-error { background: #fdf0ee; color: #c0392b; border-left: 3px solid #c0392b; }
    .field { margin-bottom: 1rem; }
    label {
      display: block; font-size: 0.82rem; font-weight: 600;
      color: #1a1a2e; margin-bottom: 0.35rem;
    }
    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%; padding: 0.72rem 1rem;
      border: 1.5px solid #d1d5db; border-radius: 10px;
      font-size: 0.92rem; font-family: inherit; color: #1a1a2e;
      background: #fff; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: #1a7a4a;
      box-shadow: 0 0 0 3px rgba(26,122,74,0.10);
    }
    input::placeholder { color: #b0b8c1; }
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 2.8rem; }
    .eye {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: #6b7280; padding: 4px; display: flex; align-items: center;
    }
    .eye:hover { color: #1a7a4a; }
    .eye svg { width: 17px; height: 17px; }
    .bar-wrap { height: 3px; background: #e5e7eb; border-radius: 2px; margin-top: 6px; overflow: hidden; }
    .bar-fill { height: 100%; width: 0%; border-radius: 2px; transition: width 0.3s, background 0.3s; }
    .bar-label { font-size: 0.7rem; color: #6b7280; margin-top: 3px; }
    .btn {
      width: 100%; padding: 0.82rem; background: #1a7a4a;
      color: #fff; border: none; border-radius: 10px;
      font-size: 0.95rem; font-weight: 600; font-family: inherit;
      cursor: pointer; margin-top: 0.5rem;
      transition: background 0.2s, transform 0.15s;
    }
    .btn:hover  { background: #125c38; }
    .btn:active { transform: scale(0.98); }
    .foot { text-align: center; font-size: 0.84rem; color: #6b7280; margin-top: 1.2rem; }
    .foot a { color: #1a7a4a; font-weight: 600; text-decoration: none; }
    .foot a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="card">

  <a href="{% url 'login' %}" class="back-btn">← Back to login</a>

  <div class="logo">
    <div class="logo-icon">📚</div>
    <div>
      <div class="logo-text">IsomoPlus</div>
      <div class="logo-sub">CBC Lesson Planner</div>
    </div>
  </div>

  <h1>Reset password</h1>
  <p class="sub">Enter your email and choose a new password.</p>

  {% if error %}
    <div class="msg msg-error">⚠️ {{ error }}</div>
  {% endif %}

  <form method="POST">
    {% csrf_token %}

    <div class="field">
      <label for="email">Email address</label>
      <input type="email" name="email" id="email"
             placeholder="you@example.com" required autocomplete="email">
    </div>

    <div class="field">
      <label for="new_password">New password</label>
      <div class="pw-wrap">
        <input type="password" name="new_password" id="new_password"
               placeholder="Create new password" required minlength="6">
        <button type="button" class="eye" id="eye1" aria-label="Toggle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <div class="bar-wrap"><div class="bar-fill" id="barFill"></div></div>
      <div class="bar-label" id="barLabel"></div>
    </div>

    <div class="field">
      <label for="confirm_password">Confirm new password</label>
      <div class="pw-wrap">
        <input type="password" name="confirm_password" id="confirm_password"
               placeholder="Repeat new password" required minlength="6">
        <button type="button" class="eye" id="eye2" aria-label="Toggle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <div id="matchHint" style="font-size:0.7rem;margin-top:4px;"></div>
    </div>

    <button type="submit" class="btn">Reset password →</button>
  </form>

  <div class="foot">
    Remembered it? <a href="{% url 'login' %}">Sign in</a>
  </div>

</div>
<script>
  function toggleEye(btnId, inputId) {
    document.getElementById(btnId).addEventListener('click', () => {
      const inp = document.getElementById(inputId);
      inp.type = inp.type === 'password' ? 'text' : 'password';
    });
  }
  toggleEye('eye1', 'new_password');
  toggleEye('eye2', 'confirm_password');

  // Strength bar
  const barFill  = document.getElementById('barFill');
  const barLabel = document.getElementById('barLabel');
  const colors   = ['#e74c3c','#e67e22','#f5c518','#1a7a4a'];
  const labels   = ['Too short','Weak','Good','Strong'];
  document.getElementById('new_password').addEventListener('input', function() {
    const v = this.value; let s = 0;
    if (v.length >= 6)  s++;
    if (v.length >= 10) s++;
    if (/[A-Z]/.test(v) && /[0-9]/.test(v)) s++;
    barFill.style.width      = ((s+1)/4*100) + '%';
    barFill.style.background = colors[s];
    barLabel.textContent     = v.length ? labels[s] : '';
    barLabel.style.color     = colors[s];
  });

  // Match hint
  document.getElementById('confirm_password').addEventListener('input', function() {
    const hint = document.getElementById('matchHint');
    const match = this.value === document.getElementById('new_password').value;
    hint.textContent  = this.value ? (match ? '✓ Passwords match' : '✗ Passwords do not match') : '';
    hint.style.color  = match ? '#1a7a4a' : '#c0392b';
  });
</script>
</body>
</html>
