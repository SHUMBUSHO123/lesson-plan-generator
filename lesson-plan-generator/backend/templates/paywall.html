<h2>Free Limit Reached</h2>
<p>You’ve used all 3 free lesson plans.</p>

{% if user.is_authenticated %}
    <a href="{% url 'pricing' %}">Upgrade to Premium</a>
{% else %}
    <a href="{% url 'register' %}">Create Account</a>
    <a href="{% url 'login' %}">Login</a>
{% endif %}

<script>
function requirePremium(action) {
    let freePlansUsed = {{ profile.free_plans_used }};
    let premiumActive = {{ profile.premium_active|yesno:"true,false" }};

    if (!premiumActive && freePlansUsed >= 3) {
        document.getElementById('subscribeModal').style.display = 'flex';
    } else {
        action();  // execute generate/download
        // Optionally, call API to increment free_plans_used
        fetch("{% url 'increment_free_plan' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            body: JSON.stringify({device_id: "{{ profile.device_id }}"})
        });
    }
}
</script>
